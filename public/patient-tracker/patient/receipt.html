<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing Receipt — Patient Tracker</title>
  <link rel="stylesheet" href="patient.css" />
</head>
<body>
  <div id="navbarRoot"></div>

  <main class="pt-container" style="max-width:740px;">
    <div class="pt-page-header no-print">
      <div>
        <h1 class="pt-page-title">Patient Billing Receipt</h1>
        <p class="pt-page-subtitle">Official clinic payment receipt ready for download or printing.</p>
      </div>
      <div style="display:flex; gap:10px;">
        <a href="reg-bills.html" class="pt-btn pt-btn-secondary">Back to Bills</a>
        <button type="button" class="pt-btn pt-btn-primary" onclick="window.print()">Print Receipt</button>
      </div>
    </div>

    <article class="pt-card" id="receiptRoot" style="padding:32px;"></article>
  </main>

  <script src="../shared/storage.js"></script>
  <script src="../login/session.js"></script>
  <script src="../login/navbar.js"></script>
  <script>
    var user = requireAuth(["Patient", "Clerk", "Admin"]);
    if (user) {
      renderNavbar("receipt.html");
      var params = new URLSearchParams(window.location.search);
      var billNum = params.get("bill");
      var bills = getData("bills");
      var bill = billNum ? bills.find(function (b) { return b.billNumber === billNum; }) : bills[0];
      var root = document.getElementById("receiptRoot");

      if (!bill) {
        root.innerHTML = '<p style="color:#64748b;">No billing receipt found.</p>';
      } else {
        var pat = getData("patients").find(function (p) { return p.patientNumber === bill.patientNumber; });
        root.innerHTML =
          '<div style="display:flex; justify-content:space-between; border-bottom:2px solid #0f172a; padding-bottom:16px; margin-bottom:20px;">' +
            '<div>' +
              '<h2 style="font-size:20px;">City General Clinic &amp; Hospital</h2>' +
              '<div style="font-size:13px; color:#475569;">Patient Billing &amp; Pharmacy Receipt</div>' +
            '</div>' +
            '<div style="text-align:right;">' +
              '<div class="mono" style="font-weight:700; font-size:15px;">' + escapeHtml(bill.billNumber) + '</div>' +
              '<div class="mono" style="font-size:12.5px; color:#475569;">Date: ' + escapeHtml(bill.date || getTodayDateString()) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="pt-form-grid" style="margin-bottom:20px; font-size:13.5px;">' +
            '<div><span style="color:#64748b;">Patient Name:</span> <strong>' + escapeHtml(pat ? pat.name : bill.patientNumber) + '</strong></div>' +
            '<div><span style="color:#64748b;">Patient ID:</span> <span class="mono">' + escapeHtml(bill.patientNumber) + '</span></div>' +
            '<div><span style="color:#64748b;">Bill Category:</span> <strong>' + escapeHtml(bill.billType === "MED" ? "Pharmacy Medicine Bill" : "Registration / OPD Bill") + '</strong></div>' +
            '<div><span style="color:#64748b;">Payment Mode:</span> ' + escapeHtml(bill.paymentMode + (bill.paymentMode === "Card" ? " (" + maskCardNumber(bill.cardNumber) + ")" : "")) + '</div>' +
          '</div>' +
          '<div style="border-top:1px solid #e2e8f0; border-bottom:1px solid #e2e8f0; padding:16px 0; display:flex; justify-content:space-between; align-items:center;">' +
            '<span style="font-size:15px; font-weight:600;">Total Amount</span>' +
            '<span class="mono" style="font-size:24px; font-weight:700;">₹' + Number(bill.billAmount).toFixed(2) + '</span>' +
          '</div>' +
          '<div style="margin-top:16px; display:flex; justify-content:space-between; font-size:13px;">' +
            '<span>Status: ' + (bill.billPaid ? '<strong class="status-text-success">PAID</strong>' : '<strong class="status-text-warning">PENDING</strong>') + '</span>' +
            '<span style="color:#64748b;">Generated by PatientTracker MCA</span>' +
          '</div>';
      }
    }
  </script>
</body>
</html>
