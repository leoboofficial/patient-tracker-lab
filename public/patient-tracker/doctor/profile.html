<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Profile — Patient Tracker</title>
  <link rel="stylesheet" href="doctor.css" />
</head>
<body>
  <div id="navbarRoot"></div>

  <main class="pt-container" style="max-width:740px;">
    <div class="pt-page-header">
      <div>
        <h1 class="pt-page-title">Doctor Profile</h1>
        <p class="pt-page-subtitle">Verified practitioner credentials and clinic contact record.</p>
      </div>
    </div>

    <section class="pt-card" id="doctorProfileCard"></section>
  </main>

  <script src="../shared/storage.js"></script>
  <script src="../login/session.js"></script>
  <script src="../login/navbar.js"></script>
  <script>
    var user = requireAuth(["Doctor"]);
    if (user) {
      renderNavbar("profile.html");
      var docId = user.refId || "DOC-101";
      var doc = getData("doctors").find(function (d) { return d.doctorId === docId; });
      var card = document.getElementById("doctorProfileCard");
      if (!doc) {
        card.innerHTML = '<p style="color:#64748b;">Doctor profile record not found.</p>';
      } else {
        card.innerHTML =
          '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; border-bottom:1px solid #e2e8f0; padding-bottom:16px;">' +
            '<div>' +
              '<h2 style="font-size:22px;">' + escapeHtml(doc.doctorName) + '</h2>' +
              '<div style="font-size:14px; color:#0f766e; font-weight:600; margin-top:4px;">' + escapeHtml(doc.qualification) + '</div>' +
            '</div>' +
            '<span class="mono" style="font-size:14px; color:#475569;">' + escapeHtml(doc.doctorId) + '</span>' +
          '</div>' +
          '<div class="pt-form-grid">' +
            '<div><div style="font-size:12px; color:#64748b;">Experience</div><div class="tabular" style="font-size:16px; font-weight:600;">' + escapeHtml(doc.experience) + ' Years</div></div>' +
            '<div><div style="font-size:12px; color:#64748b;">Age</div><div class="tabular" style="font-size:16px; font-weight:600;">' + escapeHtml(doc.age) + '</div></div>' +
            '<div><div style="font-size:12px; color:#64748b;">Contact Number</div><div class="mono" style="font-size:15px;">' + escapeHtml(doc.contact) + '</div></div>' +
            '<div><div style="font-size:12px; color:#64748b;">Clinic Address</div><div style="font-size:14.5px;">' + escapeHtml(doc.address) + '</div></div>' +
          '</div>';
      }
    }
  </script>
</body>
</html>
