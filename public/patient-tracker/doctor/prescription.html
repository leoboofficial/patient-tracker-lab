<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Prescription Builder — Patient Tracker</title>
  <link rel="stylesheet" href="doctor.css" />
</head>
<body>
  <div id="navbarRoot"></div>

  <main class="pt-container" style="max-width:960px;">
    <div class="pt-page-header">
      <div>
        <h1 class="pt-page-title">E-Prescription Builder</h1>
        <p class="pt-page-subtitle">Add non-expired medicines from stock with quantity and dosage instructions.</p>
      </div>
      <a href="print-rx.html" id="btnPrintRxLink" class="pt-btn pt-btn-secondary" style="display:none;">Print Rx Slip</a>
    </div>

    <div id="alertBox" class="pt-alert" style="display:none;"></div>

    <section class="pt-card">
      <form id="prescriptionForm">
        <div class="pt-form-grid" style="margin-bottom:20px;">
          <div class="pt-field">
            <label for="prescriptionNumber">Prescription Number</label>
            <input type="text" id="prescriptionNumber" readonly />
          </div>
          <div class="pt-field">
            <label for="consultationId">Consultation ID</label>
            <input type="text" id="consultationId" readonly />
          </div>
          <div class="pt-field">
            <label for="patientNumber">Patient Number</label>
            <input type="text" id="patientNumber" readonly />
          </div>
          <div class="pt-field">
            <label for="doctorId">Doctor ID</label>
            <input type="text" id="doctorId" readonly />
          </div>
          <div class="pt-field">
            <label for="rxDate">Prescription Date</label>
            <input type="text" id="rxDate" readonly />
          </div>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
          <h2 style="font-size:16px;">Prescribed Medicines</h2>
          <button type="button" id="btnAddMedRow" class="pt-btn pt-btn-secondary pt-btn-sm">+ Add Medicine Row</button>
        </div>

        <div id="dosageRowsContainer"></div>

        <div class="pt-field" style="margin-top:16px;">
          <label for="rxNotes">Doctor's Additional Notes (max 100 chars)</label>
          <textarea id="rxNotes" rows="2" maxlength="100" placeholder="Dietary guidance or follow-up instructions..."></textarea>
          <div id="rxNotesCounter" class="doc-char-counter">100 / 100 characters remaining</div>
        </div>

        <div class="pt-form-actions">
          <button type="submit" class="pt-btn pt-btn-primary">Save E-Prescription</button>
        </div>
      </form>
    </section>
  </main>

  <script src="../shared/storage.js"></script>
  <script src="../login/alert.js"></script>
  <script src="../login/session.js"></script>
  <script src="../login/navbar.js"></script>
  <script src="med-select.js"></script>
  <script src="dosage-grid.js"></script>
  <script src="char-count.js"></script>
  <script src="save-rx.js"></script>
  <script>
    var user = requireAuth(["Doctor"]);
    if (user) {
      renderNavbar("prescription.html");
      var params = new URLSearchParams(window.location.search);
      var latestConsult = getData("consultations").slice(-1)[0];

      document.getElementById("prescriptionNumber").value = params.get("rx") || getNextId("prescriptions", "RX");
      document.getElementById("consultationId").value = params.get("con") || (latestConsult ? latestConsult.consultationId : "CON-101");
      document.getElementById("patientNumber").value = params.get("pat") || (latestConsult ? latestConsult.patientNumber : "PAT-101");
      document.getElementById("doctorId").value = params.get("doc") || user.refId || "DOC-101";
      document.getElementById("rxDate").value = getTodayDateString();
    }
  </script>
</body>
</html>
