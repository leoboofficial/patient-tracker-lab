<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register New Clerk — Patient Tracker</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div id="navbarRoot"></div>

  <main class="pt-container" style="max-width:820px;">
    <div class="pt-page-header">
      <div>
        <h1 class="pt-page-title">Register New Clerk</h1>
        <p class="pt-page-subtitle">Add a front-desk or pharmacy clerk to the hospital roster.</p>
      </div>
      <a href="clerk-list.html" class="pt-btn pt-btn-secondary">View Clerk Directory</a>
    </div>

    <div id="alertBox" class="pt-alert" style="display:none;"></div>

    <section class="pt-card">
      <form id="addClerkForm">
        <div class="pt-form-grid">
          <div class="pt-field">
            <label for="clerkId">Clerk ID</label>
            <input type="text" id="clerkId" readonly />
          </div>
          <div class="pt-field">
            <label for="clerkName">Clerk Name</label>
            <input type="text" id="clerkName" maxlength="50" placeholder="e.g., Ramesh Iyer" required />
          </div>
          <div class="pt-field">
            <label for="age">Age (18–65)</label>
            <input type="number" id="age" min="18" max="65" required />
          </div>
          <div class="pt-field">
            <label for="contact">Phone Number (10 digits)</label>
            <input type="tel" id="contact" pattern="[0-9]{10}" maxlength="10" placeholder="9811223344" required />
          </div>
          <div class="pt-field">
            <label for="clerkDOJ">Date of Joining</label>
            <input type="date" id="clerkDOJ" required />
          </div>
          <div class="pt-field full">
            <label for="address">Address (max 50 chars)</label>
            <textarea id="address" rows="2" maxlength="50" placeholder="Front Desk Counter 1, Main Lobby" required></textarea>
          </div>
        </div>

        <div class="pt-form-actions">
          <button type="submit" class="pt-btn pt-btn-primary">Save Clerk Record</button>
          <button type="reset" class="pt-btn pt-btn-secondary" id="btnReset">Reset</button>
        </div>
      </form>
    </section>
  </main>

  <script src="../shared/storage.js"></script>
  <script src="alert.js"></script>
  <script src="session.js"></script>
  <script src="navbar.js"></script>
  <script>
    var user = requireAuth(["Admin"]);
    if (user) {
      renderNavbar("add-clerk.html");
      document.getElementById("clerkId").value = getNextId("clerks", "CLK");
      document.getElementById("clerkDOJ").value = getTodayDateString();
    }

    document.getElementById("btnReset").addEventListener("click", function () {
      setTimeout(function () {
        document.getElementById("clerkId").value = getNextId("clerks", "CLK");
      }, 0);
    });

    document.getElementById("addClerkForm").addEventListener("submit", function (e) {
      e.preventDefault();
      clearAlert();

      var clerkId = document.getElementById("clerkId").value.trim();
      var clerkName = document.getElementById("clerkName").value.trim();
      var age = parseInt(document.getElementById("age").value, 10);
      var contact = document.getElementById("contact").value.trim();
      var clerkDOJ = document.getElementById("clerkDOJ").value;
      var address = document.getElementById("address").value.trim();

      if (!/^[0-9]{10}$/.test(contact)) {
        showError("Phone Number must be exactly 10 digits.");
        return;
      }
      if (isNaN(age) || age < 18 || age > 65) {
        showError("Clerk Age must be between 18 and 65.");
        return;
      }

      var clerks = getData("clerks");
      clerks.push({
        clerkId: clerkId,
        clerkName: clerkName,
        age: age,
        contact: contact,
        clerkDOJ: clerkDOJ,
        address: address
      });
      saveData("clerks", clerks);

      var users = getData("users");
      var clerkLogin = "clerk" + clerkId.replace("CLK-", "");
      users.push({
        loginName: clerkLogin,
        password: "password",
        role: "Clerk",
        refId: clerkId,
        fullName: clerkName
      });
      saveData("users", users);

      document.getElementById("addClerkForm").reset();
      document.getElementById("clerkId").value = getNextId("clerks", "CLK");
      document.getElementById("clerkDOJ").value = getTodayDateString();
      showSuccess("Clerk " + clerkName + " (" + clerkId + ") saved. Login ID: " + clerkLogin + " / password");
    });
  </script>
</body>
</html>
