<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register New Doctor — Patient Tracker</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div id="navbarRoot"></div>

  <main class="pt-container" style="max-width:820px;">
    <div class="pt-page-header">
      <div>
        <h1 class="pt-page-title">Register New Doctor</h1>
        <p class="pt-page-subtitle">Add a physician to the doctors directory and provision a portal login.</p>
      </div>
      <a href="doctor-list.html" class="pt-btn pt-btn-secondary">View Doctor Directory</a>
    </div>

    <div id="alertBox" class="pt-alert" style="display:none;"></div>

    <section class="pt-card">
      <form id="addDoctorForm">
        <div class="pt-form-grid">
          <div class="pt-field">
            <label for="doctorId">Doctor ID</label>
            <input type="text" id="doctorId" readonly />
          </div>
          <div class="pt-field">
            <label for="doctorName">Doctor Name</label>
            <input type="text" id="doctorName" maxlength="50" placeholder="e.g., Dr. Arjun Nair" required />
          </div>
          <div class="pt-field">
            <label for="qualification">Qualification</label>
            <select id="qualification" required>
              <option value="">Select qualification</option>
              <option value="MBBS">MBBS</option>
              <option value="MBBS, MD">MBBS, MD</option>
              <option value="MBBS, MS">MBBS, MS</option>
              <option value="MBBS, DCH">MBBS, DCH</option>
            </select>
          </div>
          <div class="pt-field">
            <label for="age">Age (24–75)</label>
            <input type="number" id="age" min="24" max="75" required />
          </div>
          <div class="pt-field">
            <label for="experience">Experience (Years)</label>
            <input type="number" id="experience" min="0" max="60" required />
          </div>
          <div class="pt-field">
            <label for="contact">Contact Number (10 digits)</label>
            <input type="tel" id="contact" pattern="[0-9]{10}" maxlength="10" placeholder="9876543210" required />
          </div>
          <div class="pt-field full">
            <label for="address">Clinic Address (max 50 chars)</label>
            <textarea id="address" rows="2" maxlength="50" placeholder="Block A, City General Clinic" required></textarea>
          </div>
        </div>

        <div class="pt-form-actions">
          <button type="submit" class="pt-btn pt-btn-primary">Save Doctor Record</button>
          <button type="reset" class="pt-btn pt-btn-secondary" id="btnReset">Reset</button>
        </div>
      </form>
    </section>
  </main>

  <script src="../shared/storage.js"></script>
  <script src="alert.js"></script>
  <script src="session.js"></script>
  <script src="navbar.js"></script>
  <script>
    var user = requireAuth(["Admin"]);
    if (user) {
      renderNavbar("add-doctor.html");
      document.getElementById("doctorId").value = getNextId("doctors", "DOC");
    }

    document.getElementById("btnReset").addEventListener("click", function () {
      setTimeout(function () {
        document.getElementById("doctorId").value = getNextId("doctors", "DOC");
      }, 0);
    });

    document.getElementById("addDoctorForm").addEventListener("submit", function (e) {
      e.preventDefault();
      clearAlert();

      var doctorId = document.getElementById("doctorId").value.trim();
      var doctorName = document.getElementById("doctorName").value.trim();
      var qualification = document.getElementById("qualification").value.trim();
      var age = parseInt(document.getElementById("age").value, 10);
      var experience = parseInt(document.getElementById("experience").value, 10);
      var contact = document.getElementById("contact").value.trim();
      var address = document.getElementById("address").value.trim();

      if (!/^[0-9]{10}$/.test(contact)) {
        showError("Contact Number must be exactly 10 digits.");
        return;
      }
      if (isNaN(age) || age < 24 || age > 75) {
        showError("Doctor Age must be between 24 and 75.");
        return;
      }

      var doctors = getData("doctors");
      doctors.push({
        doctorId: doctorId,
        doctorName: doctorName,
        qualification: qualification,
        age: age,
        experience: experience,
        contact: contact,
        address: address
      });
      saveData("doctors", doctors);

      // Provision login user automatically
      var users = getData("users");
      var docLogin = "doc" + doctorId.replace("DOC-", "");
      users.push({
        loginName: docLogin,
        password: "password",
        role: "Doctor",
        refId: doctorId,
        fullName: doctorName
      });
      saveData("users", users);

      document.getElementById("addDoctorForm").reset();
      document.getElementById("doctorId").value = getNextId("doctors", "DOC");
      showSuccess("Doctor " + doctorName + " (" + doctorId + ") saved. Login ID: " + docLogin + " / password");
    });
  </script>
</body>
</html>
