<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password — Patient Tracker</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div id="navbarRoot"></div>

  <main class="pt-container" style="max-width:620px;">
    <div class="pt-page-header">
      <div>
        <h1 class="pt-page-title">Update Account Password</h1>
        <p class="pt-page-subtitle">Change your login password stored in the local users directory.</p>
      </div>
    </div>

    <div id="alertBox" class="pt-alert" style="display:none;"></div>

    <section class="pt-card">
      <form id="passwordForm">
        <div class="pt-form-grid" style="grid-template-columns:1fr;">
          <div class="pt-field">
            <label for="loginName">User Login ID</label>
            <input type="text" id="loginName" readonly />
          </div>
          <div class="pt-field">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" required />
          </div>
          <div class="pt-field">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" minlength="4" required />
          </div>
          <div class="pt-field">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" minlength="4" required />
          </div>
        </div>
        <div class="pt-form-actions">
          <button type="submit" class="pt-btn pt-btn-primary">Update Password</button>
        </div>
      </form>
    </section>
  </main>

  <script src="../shared/storage.js"></script>
  <script src="alert.js"></script>
  <script src="session.js"></script>
  <script src="navbar.js"></script>
  <script>
    var currentUser = requireAuth();
    if (currentUser) {
      renderNavbar("password.html");
      document.getElementById("loginName").value = currentUser.loginName;
    }

    document.getElementById("passwordForm").addEventListener("submit", function (e) {
      e.preventDefault();
      clearAlert();
      var cur = document.getElementById("currentPassword").value;
      var next = document.getElementById("newPassword").value;
      var conf = document.getElementById("confirmPassword").value;

      if (next !== conf) {
        showError("New password and confirmation do not match.");
        return;
      }

      var users = getData("users");
      var idx = users.findIndex(function (u) { return u.loginName === currentUser.loginName; });
      if (idx === -1 || users[idx].password !== cur) {
        showError("Current password is incorrect.");
        return;
      }

      users[idx].password = next;
      saveData("users", users);
      document.getElementById("passwordForm").reset();
      document.getElementById("loginName").value = currentUser.loginName;
      showSuccess("Password updated successfully.");
    });
  </script>
</body>
</html>
