<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Patient — Patient Tracker</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div id="navbarRoot"></div>

  <main class="pt-container" style="max-width:820px;">
    <div class="pt-page-header">
      <div>
        <h1 class="pt-page-title">Register New Patient</h1>
        <p class="pt-page-subtitle">Check in a patient as Outpatient (OUT) or Inpatient (IN).</p>
      </div>
      <a href="patient-list.html" class="pt-btn pt-btn-secondary">View Patients</a>
    </div>

    <div id="alertBox" class="pt-alert" style="display:none;"></div>

    <section class="pt-card">
      <form id="addPatientForm">
        <div class="pt-form-grid">
          <div class="pt-field">
            <label for="patientNumber">Patient Number</label>
            <input type="text" id="patientNumber" readonly />
          </div>
          <div class="pt-field">
            <label for="name">Patient Name</label>
            <input type="text" id="name" maxlength="50" placeholder="e.g., Ananya Sharma" required />
          </div>
          <div class="pt-field">
            <label>Patient Type</label>
            <div class="pt-radio-group">
              <label class="pt-radio-label">
                <input type="radio" name="type" value="OUT" checked /> OUT (Outpatient)
              </label>
              <label class="pt-radio-label">
                <input type="radio" name="type" value="IN" /> IN (Inpatient)
              </label>
            </div>
          </div>
          <div class="pt-field">
            <label for="age">Age (0–110)</label>
            <input type="number" id="age" min="0" max="110" required />
          </div>
          <div class="pt-field">
            <label for="contact">Mobile Number (10 digits)</label>
            <input type="tel" id="contact" pattern="[0-9]{10}" maxlength="10" placeholder="9900112233" required />
          </div>
          <div class="pt-field full">
            <label for="address">Home Address (max 50 chars)</label>
            <textarea id="address" rows="2" maxlength="50" placeholder="14 MG Road, Indiranagar" required></textarea>
          </div>
        </div>

        <div class="pt-form-actions">
          <button type="submit" class="pt-btn pt-btn-primary">Register Patient</button>
          <a href="reg-bill.html" class="pt-btn pt-btn-secondary">Proceed to OPD Bill</a>
        </div>
      </form>
    </section>
  </main>

  <script src="../shared/storage.js"></script>
  <script src="alert.js"></script>
  <script src="session.js"></script>
  <script src="navbar.js"></script>
  <script>
    var user = requireAuth(["Clerk", "Admin"]);
    if (user) {
      renderNavbar("add-patient.html");
      document.getElementById("patientNumber").value = getNextId("patients", "PAT");
    }

    document.getElementById("addPatientForm").addEventListener("submit", function (e) {
      e.preventDefault();
      clearAlert();

      var patientNumber = document.getElementById("patientNumber").value.trim();
      var name = document.getElementById("name").value.trim();
      var typeEl = document.querySelector('input[name="type"]:checked');
      var type = typeEl ? typeEl.value : "OUT";
      var age = parseInt(document.getElementById("age").value, 10);
      var contact = document.getElementById("contact").value.trim();
      var address = document.getElementById("address").value.trim();

      if (isNaN(age) || age < 0 || age > 110) {
        showError("Age must be between 0 and 110.");
        return;
      }
      if (!/^[0-9]{10}$/.test(contact)) {
        showError("Mobile Number must be exactly 10 digits.");
        return;
      }

      var patients = getData("patients");
      patients.push({
        patientNumber: patientNumber,
        name: name,
        type: type,
        age: age,
        contact: contact,
        address: address
      });
      saveData("patients", patients);

      var users = getData("users");
      var patLogin = "pat" + patientNumber.replace("PAT-", "");
      users.push({
        loginName: patLogin,
        password: "password",
        role: "Patient",
        refId: patientNumber,
        fullName: name
      });
      saveData("users", users);

      document.getElementById("addPatientForm").reset();
      document.getElementById("patientNumber").value = getNextId("patients", "PAT");
      showSuccess("Patient " + name + " (" + patientNumber + ") registered. Portal ID: " + patLogin + " / password");
    });
  </script>
</body>
</html>
