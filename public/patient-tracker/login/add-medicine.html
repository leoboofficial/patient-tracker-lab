<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Medicine Stock — Patient Tracker</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div id="navbarRoot"></div>

  <main class="pt-container" style="max-width:820px;">
    <div class="pt-page-header">
      <div>
        <h1 class="pt-page-title">Add Medicine to Inventory</h1>
        <p class="pt-page-subtitle">Log new pharmacy batches with quantity, unit price, and future expiry date.</p>
      </div>
      <a href="stock-list.html" class="pt-btn pt-btn-secondary">View Stock Table</a>
    </div>

    <div id="alertBox" class="pt-alert" style="display:none;"></div>

    <section class="pt-card">
      <form id="addMedicineForm">
        <div class="pt-form-grid">
          <div class="pt-field">
            <label for="medicineId">Medicine ID</label>
            <input type="text" id="medicineId" readonly />
          </div>
          <div class="pt-field">
            <label for="name">Medicine Name</label>
            <input type="text" id="name" maxlength="60" placeholder="e.g., Ibuprofen 400mg" required />
          </div>
          <div class="pt-field">
            <label for="company">Manufacturer / Company</label>
            <input type="text" id="company" maxlength="60" placeholder="e.g., Cipla Ltd" required />
          </div>
          <div class="pt-field">
            <label for="quantity">Quantity (Units)</label>
            <input type="number" id="quantity" min="1" required />
          </div>
          <div class="pt-field">
            <label for="price">Unit Price (INR)</label>
            <input type="number" id="price" min="1" step="0.01" required />
          </div>
          <div class="pt-field">
            <label for="expiryDate">Expiry Date (Future Date)</label>
            <input type="date" id="expiryDate" required />
          </div>
        </div>

        <div class="pt-form-actions">
          <button type="submit" class="pt-btn pt-btn-primary">Add to Stock</button>
          <button type="reset" class="pt-btn pt-btn-secondary" id="btnReset">Reset</button>
        </div>
      </form>
    </section>
  </main>

  <script src="../shared/storage.js"></script>
  <script src="alert.js"></script>
  <script src="session.js"></script>
  <script src="navbar.js"></script>
  <script>
    var user = requireAuth(["Clerk", "Admin"]);
    if (user) {
      renderNavbar("add-medicine.html");
      document.getElementById("medicineId").value = getNextId("medicines", "MED");
      document.getElementById("expiryDate").setAttribute("min", getTodayDateString());
    }

    document.getElementById("btnReset").addEventListener("click", function () {
      setTimeout(function () {
        document.getElementById("medicineId").value = getNextId("medicines", "MED");
      }, 0);
    });

    document.getElementById("addMedicineForm").addEventListener("submit", function (e) {
      e.preventDefault();
      clearAlert();

      var medicineId = document.getElementById("medicineId").value.trim();
      var name = document.getElementById("name").value.trim();
      var company = document.getElementById("company").value.trim();
      var quantity = parseInt(document.getElementById("quantity").value, 10);
      var price = parseFloat(document.getElementById("price").value);
      var expiryDate = document.getElementById("expiryDate").value;

      if (isNaN(quantity) || quantity <= 0) {
        showError("Quantity must be greater than 0.");
        return;
      }
      if (isNaN(price) || price <= 0) {
        showError("Unit price must be greater than 0.");
        return;
      }
      if (!expiryDate || expiryDate <= getTodayDateString()) {
        showError("Expiry Date must be a future date.");
        return;
      }

      var medicines = getData("medicines");
      medicines.push({
        medicineId: medicineId,
        name: name,
        company: company,
        quantity: quantity,
        price: price,
        expiryDate: expiryDate
      });
      saveData("medicines", medicines);

      document.getElementById("addMedicineForm").reset();
      document.getElementById("medicineId").value = getNextId("medicines", "MED");
      showSuccess("Medicine " + name + " (" + medicineId + ") added to pharmacy stock.");
    });
  </script>
</body>
</html>
